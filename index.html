<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculadora de Precios - Abarrotes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* iOS gray background */
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom toggle switch styling */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #34C759; /* iOS Green */
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #34C759;
        }
        
        /* Smooth transitions */
        .transition-all {
            transition-property: all;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 300ms;
        }

        /* Number input hides arrows */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="antialiased text-gray-900 min-h-screen flex items-start justify-center sm:py-8">

    <main class="w-full max-w-md bg-white min-h-screen sm:min-h-0 sm:rounded-[2rem] sm:shadow-2xl overflow-hidden flex flex-col relative pb-32">
        
        <!-- Header -->
        <header class="bg-white border-b border-gray-100 pt-12 pb-4 px-6 sticky top-0 z-10">
            <h1 class="text-2xl font-bold text-gray-800 tracking-tight text-center">Calculadora de Precios</h1>
            <p class="text-sm text-gray-500 text-center mt-1">Ingresa el ticket para calcular</p>
        </header>

        <!-- Form Content -->
        <div class="p-6 space-y-8 flex-1 overflow-y-auto">
            
            <section class="space-y-4">
                <div>
                    <label for="totalPackage" class="block text-sm font-semibold text-gray-700 mb-2">Precio total del paquete según ticket</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <span class="text-gray-500 font-semibold text-lg">$</span>
                        </div>
                        <input type="number" id="totalPackage" step="0.01" inputmode="decimal" placeholder="0.00" 
                            class="w-full pl-8 pr-4 py-4 bg-gray-50 border border-gray-200 rounded-2xl text-xl font-semibold text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                            oninput="calculate()">
                    </div>
                </div>

                <div>
                    <label for="pieces" class="block text-sm font-semibold text-gray-700 mb-2">Cantidad de piezas en el paquete</label>
                    <input type="number" id="pieces" step="1" inputmode="numeric" placeholder="Ej. 12" 
                        class="w-full px-4 py-4 bg-gray-50 border border-gray-200 rounded-2xl text-xl font-semibold text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                        oninput="calculate()">
                </div>
            </section>

            <section>
                <label class="block text-sm font-semibold text-gray-700 mb-3">Tipo de Producto</label>
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" id="btnBeverage" onclick="setProductType('beverage')" 
                        class="border-2 border-blue-500 bg-blue-50 text-blue-700 rounded-2xl py-4 flex flex-col items-center justify-center gap-2 transition-all shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2v10z" style="display:none;"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19v-7m4 7v-7m4 7v-7m-8-4h.01M14 8h.01M18 8h.01M6 19v-7a4 4 0 018 0v7M6 12a4 4 0 018 0"/>
                            <!-- Drink icon -->
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z" style="display:none;"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2z" style="display:none;"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10 4h4M9 4l-1 16a2 2 0 002 2h4a2 2 0 002-2l-1-16M9 4h6" />
                        </svg>
                        <span class="font-bold text-sm">Bebidas (1.32)</span>
                    </button>
                    <button type="button" id="btnOther" onclick="setProductType('other')" 
                        class="border-2 border-gray-200 bg-gray-50 text-gray-500 rounded-2xl py-4 flex flex-col items-center justify-center gap-2 transition-all hover:bg-gray-100">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                        </svg>
                        <span class="font-bold text-sm">Otros (1.52)</span>
                    </button>
                </div>
            </section>

            <section class="bg-gray-50 rounded-2xl border border-gray-200 p-5 space-y-4">
                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="text-base font-semibold text-gray-800">Impuesto IEPS</h3>
                        <p class="text-xs text-gray-500 mt-0.5">Activar si el ticket lo indica</p>
                    </div>
                    
                    <!-- iOS Style Toggle -->
                    <div class="relative inline-block w-14 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" name="toggle" id="iepsToggle" class="toggle-checkbox absolute block w-7 h-7 rounded-full bg-white border-4 border-gray-300 appearance-none cursor-pointer z-10 transition-all focus:outline-none" onclick="toggleIeps()"/>
                        <label for="iepsToggle" class="toggle-label block overflow-hidden h-7 rounded-full bg-gray-300 cursor-pointer transition-all"></label>
                    </div>
                </div>

                <div id="iepsConfig" class="hidden pt-3 border-t border-gray-200 transition-all">
                    <label for="iepsPercent" class="block text-sm font-semibold text-gray-700 mb-2">Porcentaje de IEPS (%)</label>
                    <div class="relative">
                        <input type="number" id="iepsPercent" step="0.1" inputmode="decimal" value="8" 
                            class="w-full px-4 py-3 bg-white border border-gray-300 rounded-xl text-lg font-semibold text-gray-900 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all"
                            oninput="calculate()">
                        <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
                            <span class="text-gray-500 font-semibold">%</span>
                        </div>
                    </div>
                </div>
            </section>
            
            <!-- Error messages -->
            <div id="errorMessage" class="hidden bg-red-50 text-red-600 px-4 py-3 rounded-xl text-sm font-medium border border-red-100">
                <!-- Error text injected here -->
            </div>
            
            <div class="h-8"></div> <!-- spacer -->
        </div>

        <!-- Fixed Results Panel at Bottom -->
        <div id="resultsPanel" class="absolute bottom-0 w-full bg-gray-900 text-white rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.1)] transition-transform duration-300 transform translate-y-full px-6 py-6 border-t border-gray-800">
            <div class="w-12 h-1.5 bg-gray-700 rounded-full mx-auto mb-5"></div>
            
            <div class="grid grid-cols-2 gap-y-3 gap-x-4 text-sm mb-4">
                <div class="text-gray-400">Tipo de producto:</div>
                <div class="text-right font-semibold" id="resType">Bebida</div>
                
                <div class="text-gray-400">IEPS:</div>
                <div class="text-right font-semibold" id="resIeps">Desactivado</div>

                <div class="text-gray-400">Piezas:</div>
                <div class="text-right font-semibold" id="resPieces">0</div>

                <div class="text-gray-400">Costo exacto p/pieza:</div>
                <div class="text-right font-semibold text-blue-300" id="resCost">$0.00</div>
                
                <div class="text-gray-400">Multiplicador:</div>
                <div class="text-right font-semibold" id="resMultiplier">1.32</div>

                <div class="text-gray-400">Venta (Antes de redondeo):</div>
                <div class="text-right font-medium text-gray-300" id="resCalc">$0.00</div>
            </div>

            <div class="bg-gray-800 rounded-2xl p-4 flex items-center justify-between border border-gray-700">
                <div>
                    <div class="text-xs font-bold text-green-400 uppercase tracking-wider mb-1">Precio para Etiqueta</div>
                    <div class="text-gray-400 text-xs">Venta Final Redondeado</div>
                </div>
                <div class="text-4xl font-extrabold text-white tracking-tight" id="resFinal">$0</div>
            </div>
        </div>
    </main>

    <script>
        // State
        let currentType = 'beverage'; // 'beverage' or 'other'
        const multipliers = {
            beverage: 1.32,
            other: 1.52
        };

        // Formatter para moneda
        const currencyFormatter = new Intl.NumberFormat('es-MX', {
            style: 'currency',
            currency: 'MXN',
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });

        const exactNumberFormatter = new Intl.NumberFormat('es-MX', {
            style: 'currency',
            currency: 'MXN',
            minimumFractionDigits: 0,
            maximumFractionDigits: 0
        });

        // UI Interactions
        function setProductType(type) {
            currentType = type;
            const btnBeverage = document.getElementById('btnBeverage');
            const btnOther = document.getElementById('btnOther');

            if (type === 'beverage') {
                btnBeverage.className = "border-2 border-blue-500 bg-blue-50 text-blue-700 rounded-2xl py-4 flex flex-col items-center justify-center gap-2 transition-all shadow-sm";
                btnOther.className = "border-2 border-gray-200 bg-gray-50 text-gray-500 rounded-2xl py-4 flex flex-col items-center justify-center gap-2 transition-all hover:bg-gray-100";
            } else {
                btnOther.className = "border-2 border-purple-500 bg-purple-50 text-purple-700 rounded-2xl py-4 flex flex-col items-center justify-center gap-2 transition-all shadow-sm";
                btnBeverage.className = "border-2 border-gray-200 bg-gray-50 text-gray-500 rounded-2xl py-4 flex flex-col items-center justify-center gap-2 transition-all hover:bg-gray-100";
            }
            calculate();
        }

        function toggleIeps() {
            const isChecked = document.getElementById('iepsToggle').checked;
            const configDiv = document.getElementById('iepsConfig');
            if (isChecked) {
                configDiv.classList.remove('hidden');
            } else {
                configDiv.classList.add('hidden');
            }
            calculate();
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            if (message) {
                errorDiv.textContent = message;
                errorDiv.classList.remove('hidden');
                hideResults();
            } else {
                errorDiv.classList.add('hidden');
            }
        }

        function showResults() {
            document.getElementById('resultsPanel').classList.remove('translate-y-full');
            document.querySelector('main').classList.add('pb-80'); // Extra padding so scroll reaches bottom
        }

        function hideResults() {
            document.getElementById('resultsPanel').classList.add('translate-y-full');
            document.querySelector('main').classList.remove('pb-80');
        }

        // Main Calculation Logic
        function calculate() {
            const totalStr = document.getElementById('totalPackage').value;
            const piecesStr = document.getElementById('pieces').value;
            
            // Si están vacíos, ocultamos error pero tampoco mostramos resultado
            if (!totalStr || !piecesStr) {
                showError("");
                hideResults();
                return;
            }

            const total = parseFloat(totalStr);
            const pieces = parseInt(piecesStr, 10);

            // Validaciones
            if (isNaN(total) || total < 0) {
                showError("Por favor, introduce un precio total válido.");
                return;
            }
            if (isNaN(pieces) || pieces <= 0) {
                showError("La cantidad de piezas debe ser mayor a cero.");
                return;
            }

            showError(""); // Limpiar errores

            // 1. Obtener precio total y dividir entre piezas (PASO 1 y 2)
            const rawCost = total / pieces;

            // 2. Obtener precio de costo con estrictamente dos decimales (PASO 3)
            // Usamos Math.round sobre la multiplicación para asegurar redondeo exacto de 2 decimales
            const costPerPiece = Math.round(rawCost * 100) / 100;

            // 3. Determinar multiplicador (PASO 4)
            const multiplier = multipliers[currentType];

            // 4. Calcular precio de venta base (PASO 5)
            let calculatedSalePrice = costPerPiece * multiplier;

            // 5. Aplicar IEPS si está activado (PASO 6)
            const iepsToggle = document.getElementById('iepsToggle').checked;
            let iepsLabel = "Desactivado";
            if (iepsToggle) {
                const iepsPercent = parseFloat(document.getElementById('iepsPercent').value) || 0;
                // Aplicamos el % al precio de venta calculado
                calculatedSalePrice = calculatedSalePrice * (1 + (iepsPercent / 100));
                iepsLabel = `Activado (${iepsPercent}%)`;
            }

            // 6. Redondeo comercial usando regla del .50 al precio final (PASO 7)
            // Math.round de JavaScript aplica exactamente la regla: .50 o más sube, menos de .50 baja.
            const finalSalePrice = Math.round(calculatedSalePrice);

            // 7. Mostrar resultados (PASO 8)
            document.getElementById('resType').textContent = currentType === 'beverage' ? 'Bebida (Refrescos, Jugos...)' : 'Otro Producto';
            document.getElementById('resIeps').textContent = iepsLabel;
            document.getElementById('resPieces').textContent = pieces;
            document.getElementById('resCost').textContent = currencyFormatter.format(costPerPiece);
            document.getElementById('resMultiplier').textContent = multiplier.toFixed(2);
            document.getElementById('resCalc').textContent = currencyFormatter.format(calculatedSalePrice);
            
            // Highlighted final output
            document.getElementById('resFinal').textContent = exactNumberFormatter.format(finalSalePrice);

            showResults();
        }

        // Initialize state on load
        window.onload = () => {
            document.getElementById('totalPackage').value = '';
            document.getElementById('pieces').value = '';
            setProductType('beverage');
            document.getElementById('iepsToggle').checked = false;
        };
    </script>
</body>
</html>
